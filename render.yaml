# Render Blueprint for the Foren relay. When you connect this repo to Render,
# it reads this file and preconfigures the service. The one secret
# (RELAY_SOLANA_SECRET) is NOT in here — you paste it into the dashboard.
services:
  - type: web
    name: foren-relay
    runtime: node
    plan: free # free sleeps after ~15 min idle (slow first request); "starter" (~$7/mo) stays awake
    # --include=dev forces devDependencies (typescript + @types/*) to install even
    # though NODE_ENV=production would otherwise skip them — they're needed to compile.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /livez
    envVars:
      - key: NODE_ENV
        value: production
      - key: SOLANA_CLUSTER
        value: devnet
      - key: PINNING_PROVIDER
        value: pinata # IPFS pinning for hosted vault backups. Needs PINATA_JWT
        # (a Pinata key WITH pinFileToIPFS + unpin scopes), set in the dashboard.
        # If PINATA_JWT is unset the relay safely falls back to noop (no crash).
      # Allowed request origins: the Capacitor mobile app (https://localhost,
      # capacitor://localhost) AND the web PWA — the custom domain plus the
      # onrender.com fallback (kept so nothing breaks during the DNS cutover).
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost,https://app.forenlabs.co.uk,https://foren-app.onrender.com
      # The devnet signing key (JSON array from relay/.solana-keypair.json).
      # sync:false = you set it by hand in the dashboard so it stays a secret.
      - key: RELAY_SOLANA_SECRET
        sync: false
      # Durable usage storage (free): create a Turso database (turso.tech),
      # then paste its URL + auth token here in the dashboard. Without these the
      # relay falls back to local SQLite, which is EPHEMERAL on the free plan
      # (usage counts + weekly reports reset on every redeploy).
      - key: USAGE_LIBSQL_URL
        sync: false
      - key: USAGE_LIBSQL_AUTH_TOKEN
        sync: false
